# Copy to helix.config.yaml and fill in secrets.
# Do not commit helix.config.yaml.
#
# Paste OpenRouter / Cursor API keys in the Settings UI. They are stored here as
# openrouter.token / cursor.token (never returned by the API).
# Active LLM provider: openrouter | cursor
provider: openrouter

# Models are suggestions only — use any OpenRouter model ids you prefer.
# Runtime resolves: openrouter.agents.<id>.model, else openrouter.default_model.

openrouter:
  token_env: OPENROUTER_TOKEN
  app_name: "Helix"
  default_model: "openai/gpt-4o-mini"
  agents:
    task_validator:
      model: "openai/gpt-4o-mini"
    solution_strategist:
      model: "anthropic/claude-sonnet-4"
    technical_architect:
      model: "openai/gpt-4o"
    code_builder:
      model: "anthropic/claude-sonnet-4"
    sql_guardian:
      model: "openai/gpt-4o-mini"
    implementation_auditor:
      model: "openai/gpt-4o-mini"
    response_publisher:
      model: "openai/gpt-4o-mini"


cursor:
  token_env: CURSOR_API_KEY
  app_name: "Helix"
  default_model: "composer-2"
  agents:
    task_validator:
      model: "composer-2"
    solution_strategist:
      model: "composer-2"
    technical_architect:
      model: "composer-2"
    code_builder:
      model: "composer-2"
    sql_guardian:
      model: "composer-2"
    implementation_auditor:
      model: "composer-2"
    response_publisher:
      model: "composer-2"
app:
  secret_key: "change-me"
  debug: true
  allowed_hosts:
    - "127.0.0.1"
    - "localhost"
  cors_origins:
    - "http://127.0.0.1:5173"
    - "http://localhost:5173"

database:
  # Default: AdventureWorks LT sample SQLite (downloaded + installed on first API start).
  # Engine: sqlite | postgresql | sqlserver
  engine: sqlite
  name: helix-sample.sqlite
  # PostgreSQL example:
  # engine: postgresql
  # host: "127.0.0.1"
  # port: 5432
  # name: helix
  # user: helix
  # password: ""
  # sslmode: prefer
  # SQL Server example (e.g. full AdventureWorks):
  # engine: sqlserver
  # host: "127.0.0.1"
  # port: 1433
  # name: AdventureWorksLT2022
  # user: sa
  # password: ""
  # driver: "ODBC Driver 18 for SQL Server"
  # trust_server_certificate: true
  # encrypt: true


frontend:
  api_base_url: "http://127.0.0.1:8000"

# Sandbox reuses a pre-installed interpreter — never pip-installs per request.
sandbox:
  allow_pip_install: false
  python_executable: null # null = sys.executable from the running app
  timeout_seconds: 60
  max_retries: 3 # code_builder runtime error loop
  max_verify_retries: 2 # auditor fail → code_builder
  max_rows: 10000

sql_guardian:
  max_retries: 3 # reject → code_builder
  require_row_limit: true # TOP / FETCH / LIMIT (unless pure aggregate)
  forbid_select_star: true
  max_rows: 10000 # align with sandbox.max_rows

# Pipeline layout is stored in helix.config.yaml as pipeline_graph (runner)
# and pipeline_flow (Arrange / Graph structured IF-ELSE and Loop). Edit in the UI.

# Optional user-defined agents (not part of the Analysis runtime pipeline).
# custom_agents:
#   - id: pipeline_designer
#     name: Pipeline Designer
#     description: Designs and documents analysis pipelines

