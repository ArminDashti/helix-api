# Copy to helix.config.yaml and fill in secrets.
# Do not commit helix.config.yaml.
#
# Paste the OpenRouter or OpenAI-compatible API key in the web UI Settings page.
# Keys are stored as openrouter.token (never returned by the API).
# provider: openrouter | openai_compatible — both use OpenAI-compatible chat completions.
# openrouter.base_url defaults to https://openrouter.ai/api/v1 for OpenRouter.
provider: openrouter

# Models are suggestions only — use any model ids your host accepts.
# Runtime resolves: openrouter.agents.<id>.model, else openrouter.default_model.

openrouter:
  token_env: OPENROUTER_TOKEN
  base_url: "https://openrouter.ai/api/v1"
  app_name: "Helix"
  default_model: "auto"
  # Per chat/completions call; pipeline agents can exceed 90s with large prompts.
  timeout_seconds: 600
  agents:
    task_validator:
      model: "auto"
    solution_strategist:
      model: "auto"
    technical_architect:
      model: "auto"
    code_builder:
      model: "auto"
    sql:
      model: "auto"
    implementation_auditor:
      model: "auto"
    response_publisher:
      model: "auto"


# Unused leftover section (Settings no longer edits this). Chat uses openrouter.* only.
cursor:
  token_env: CURSOR_API_KEY
  app_name: "Helix"
  default_model: "auto"
  agents:
    task_validator:
      model: "auto"
    solution_strategist:
      model: "auto"
    technical_architect:
      model: "auto"
    code_builder:
      model: "auto"
    sql:
      model: "auto"
    implementation_auditor:
      model: "auto"
    response_publisher:
      model: "auto"
app:
  secret_key: "change-me"
  debug: true
  allowed_hosts:
    - "127.0.0.1"
    - "localhost"
  cors_origins:
    - "http://127.0.0.1:5173"
    - "http://localhost:5173"

database:
  # Default: AdventureWorks LT sample SQLite (downloaded + installed on first API start).
  # Engine: sqlite | postgresql | sqlserver
  engine: sqlite
  name: helix-sample.sqlite
  # PostgreSQL example:
  # engine: postgresql
  # host: "127.0.0.1"
  # port: 5432
  # name: helix
  # user: helix
  # password: ""
  # sslmode: prefer
  # SQL Server example (e.g. full AdventureWorks):
  # engine: sqlserver
  # host: "127.0.0.1"
  # port: 1433
  # name: AdventureWorksLT2022
  # user: sa
  # password: ""
  # driver: "ODBC Driver 18 for SQL Server"
  # trust_server_certificate: true
  # encrypt: true


frontend:
  api_base_url: "http://127.0.0.1:8000"

# Sandbox reuses a pre-installed interpreter — never pip-installs per request.
sandbox:
  allow_pip_install: false
  python_executable: null # null = sys.executable from the running app
  timeout_seconds: 60
  max_retries: 3 # code_builder runtime error loop
  max_verify_retries: 2 # auditor fail → code_builder
  max_rows: 10000

sql:
  max_retries: 3
  require_row_limit: true # TOP / FETCH / LIMIT (unless pure aggregate)
  forbid_select_star: true
  max_rows: 10000 # align with sandbox.max_rows

# Pipeline layout is stored in helix.config.yaml as pipeline_graph (runner)
# and pipeline_flow (Arrange stages: IF / IF NOT / Proceed). Edit in the UI.

# Optional user-defined agents (not part of the Analysis runtime pipeline).
